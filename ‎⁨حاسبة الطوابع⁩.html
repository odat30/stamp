<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حاسبة الطوابع</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<style>
:root{--bg:#EDF2F0;--card:#fff;--ink:#10291F;--mute:#5B6E66;--line:#D5DED9;--green:#1B7355;--green2:#124B38;--on:#fff;--sh:rgba(16,41,31,.14);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1613;--card:#15231E;--ink:#E7F0EC;--mute:#93A8A0;--line:#27393A;--green:#2FA37C;--green2:#1B6F55;--on:#06150F;--sh:rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C1613;--card:#15231E;--ink:#E7F0EC;--mute:#93A8A0;--line:#27393A;--green:#2FA37C;--green2:#1B6F55;--on:#06150F;--sh:rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,"Segoe UI",sans-serif;line-height:1.6;display:flex;flex-direction:column;min-height:100dvh;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
.bar{background:linear-gradient(160deg,var(--green2),var(--green));color:var(--on);display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;font-size:1.2rem;padding:18px 16px 44px;border-radius:0 0 30px 30px}
.bar svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{width:100%;max-width:520px;margin:-26px auto 0;padding:0 16px 20px;flex:1;display:flex;flex-direction:column;align-items:center;text-align:center}
.card{width:100%;background:var(--card);border-radius:24px;padding:18px 16px 20px;box-shadow:0 14px 30px -16px var(--sh),0 0 0 1px var(--line)}
label{display:block;font-weight:600;color:var(--mute);margin-bottom:8px}
.field{display:flex;align-items:center;gap:8px;width:min(100%,300px);margin:0 auto;background:var(--bg);border:2px solid transparent;border-radius:16px;padding:4px 14px;transition:border-color .15s,box-shadow .15s}
.field:focus-within{border-color:var(--green);box-shadow:0 0 0 4px color-mix(in srgb,var(--green) 22%,transparent)}
#amt{flex:1;min-width:0;width:100%;border:0;background:transparent;outline:0;font:inherit;font-size:1.5rem;font-weight:800;color:var(--ink);direction:ltr;text-align:center;padding:6px 0}
.unit{color:var(--mute);font-weight:600}
.stamp{width:min(100%,300px);margin:22px auto 0;background:linear-gradient(145deg,var(--green),var(--green2));color:var(--on);border:7px dotted var(--bg);border-radius:8px;padding:10px 12px;box-shadow:0 16px 28px -14px var(--sh);text-align:center}
.stamp small{display:block;opacity:.92;font-weight:600}
.stamp b{display:block;font-size:2.4rem;font-weight:800;line-height:1.2;direction:ltr;font-variant-numeric:tabular-nums}
.adv{font-size:.8rem;color:var(--mute);margin:12px 0 0}
button{font:inherit;font-weight:700;border-radius:999px;min-height:48px;padding:10px 34px;cursor:pointer;border:1.5px solid var(--green);background:transparent;color:var(--green);margin-top:20px;transition:background .15s,color .15s,transform .1s}
button:hover{background:var(--green);color:var(--on)}
button:active{transform:scale(.97)}
input:focus-visible,button:focus-visible{outline:3px solid var(--green);outline-offset:2px}
footer{margin-top:auto;padding-top:26px;color:var(--mute);font-weight:600;font-size:.9rem}
footer::before{content:"";display:block;width:36px;height:3px;border-radius:3px;background:var(--line);margin:0 auto 10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="bar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>حاسبة الطوابع</header>
<main>
<div class="card">
<label for="amt">قيمة المعاملة</label>
<div class="field"><input id="amt" inputmode="decimal" autocomplete="off" placeholder="0.000"><span class="unit" id="cur1">دينار</span></div>
<div class="stamp"><small>قيمة الطوابع</small><b id="total">0.000</b><small id="cur2">دينار</small></div>
<p class="adv">* يخصم 0.5 دينار لمعاملة السلفة</p>
<button id="clear">مسح</button>
</div>
<footer>قسم الشؤون المالية / بني كنانه</footer>
</main>
<script>
(function(){
var S={r1:0.6,r2:0.15,fx:0.5,mn:0.5,th:50,cur:"دينار"};
try{localStorage.removeItem("st_hist")}catch(e){}
var $=function(i){return document.getElementById(i)};
function num(t){t=String(t).replace(/[٠-٩]/g,function(c){return c.charCodeAt(0)-1632}).replace(/[٫،,]/g,".");var n=parseFloat(t);return isFinite(n)?n:0}
function r3(x){return Math.round(x*1000)/1000}
function up(x){return Math.ceil(x/0.1-1e-7)*0.1}
function total(a){
 if(!(a>0))return 0;
 var d=r3(Math.max(S.mn,up(a*S.r2/100)));
 if(a<S.th)return d;
 return r3(Math.max(S.mn,up(a*S.r1/100))+d+S.fx);
}
var f3=function(x){return x.toFixed(3)},shown=0,raf;
function show(to){
 cancelAnimationFrame(raf);
 if(matchMedia("(prefers-reduced-motion: reduce)").matches){shown=to;$("total").textContent=f3(to);return}
 var from=shown,t0=performance.now();
 (function step(t){var p=Math.min(1,(t-t0)/220),e=1-Math.pow(1-p,3);shown=from+(to-from)*e;$("total").textContent=f3(shown);if(p<1)raf=requestAnimationFrame(step);else shown=to})(t0);
}
function render(){show(total(num($("amt").value)))}
$("amt").addEventListener("input",render);
$("clear").onclick=function(){$("amt").value="";render();$("amt").focus()};
render();
})();
</script>
</body>
</html>
